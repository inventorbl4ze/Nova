databases:
  - name: nova-ai-db
    databaseName: nova_ai
    user: nova_user
    plan: free

services:
  - type: web
    name: nova-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
